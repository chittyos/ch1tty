name: CI

on:
  push:
    branches: [main, "auto/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run coverage

      - name: Verify servers.json is valid JSON
        run: |
          node -e "JSON.parse(require(\"fs\").readFileSync(\"servers.json\",\"utf8\")); console.log(\"servers.json: valid\")"

      - name: Typecheck Worker/DO codebase (src/)
        run: npm run typecheck:worker

      - name: Apps coverage (src/ 100% stmts/lines/funcs, 95% branches)
        run: npm run coverage:apps

      - name: Typecheck apps (all apps/*/src — must find process via root @types/node)
        run: npm run typecheck:apps

  apps-build-and-test:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tasks-mcp, ledger-mcp, session-coordinator-mcp, evidence-mcp, comms-mcp]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build shared packages
        run: npm run build --workspace=packages/shared-types --workspace=packages/shared-logger --workspace=packages/shared-mcp

      - name: Install focused app dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --workspaces=false --install-links

      - name: Build (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Test (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm test

  security:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Audit high and critical build dependencies
        run: npm audit --audit-level=high

      - name: Audit apps/tasks-mcp
        working-directory: apps/tasks-mcp
        run: npm ci --ignore-scripts --workspaces=false --install-links && npm audit --omit=dev --workspaces=false

      - name: Audit apps/ledger-mcp
        working-directory: apps/ledger-mcp
        run: npm ci --ignore-scripts --workspaces=false --install-links && npm audit --omit=dev --workspaces=false

      - name: Audit apps/session-coordinator-mcp
        working-directory: apps/session-coordinator-mcp
        run: npm ci --ignore-scripts --workspaces=false --install-links && npm audit --omit=dev --workspaces=false

      - name: Audit apps/evidence-mcp
        working-directory: apps/evidence-mcp
        run: npm ci --ignore-scripts --workspaces=false --install-links && npm audit --omit=dev --workspaces=false

      - name: Audit apps/comms-mcp
        working-directory: apps/comms-mcp
        run: npm ci --ignore-scripts --workspaces=false --install-links && npm audit --omit=dev --workspaces=false

      - name: Audit shared MCP build dependencies
        working-directory: packages/shared-mcp
        run: npm ci --ignore-scripts --workspaces=false && npm audit --workspaces=false
